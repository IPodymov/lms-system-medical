name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Runs the whole suite against local SQLite with in-memory Celery/Channels,
  # matching the fast path already used by the Dockerfile's build step.
  # Never touches the real DATABASE_URL / production database.
  DJANGO_USE_SQLITE: "1"
  DJANGO_SECRET_KEY: ci-only-insecure-key

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: ruff check
        run: ruff check apps config

      - name: ruff format --check
        run: ruff format --check apps config

      - name: pylint
        # pyproject.toml already restricts hard failure to fail-on = [E, F];
        # --fail-under=0 stops pylint's own score threshold from also failing
        # the build on pre-existing refactor/convention notes.
        run: pylint --fail-under=0 apps config

      - name: Django system check
        run: python manage.py check

      - name: Missing migrations check
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python manage.py test
