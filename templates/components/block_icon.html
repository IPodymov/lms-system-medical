{% comment %}
  Иконка типа учебного блока.

  Параметры:
    icon — text | video | file | quiz | lock

  Иконка декоративная: рядом всегда есть название блока и, для состояний,
  текстовая подпись. Поэтому aria-hidden, а не aria-label — иначе скринридер
  прочитает тип дважды.
{% endcomment %}
<svg class="outline-block__icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  {% if icon == 'quiz' %}
    <path d="M7.2 7.4a2.8 2.8 0 1 1 3.4 2.7c-.5.1-.8.6-.8 1.1v.6"/><path d="M10 15v.4"/><circle cx="10" cy="10" r="7.6"/>
  {% elif icon == 'file' %}
    <path d="M11.5 2.6H6.2a1.6 1.6 0 0 0-1.6 1.6v11.6a1.6 1.6 0 0 0 1.6 1.6h7.6a1.6 1.6 0 0 0 1.6-1.6V6.6z"/><path d="M11.5 2.6v4h3.9"/>
  {% elif icon == 'video' %}
    <rect x="2.6" y="4.6" width="14.8" height="10.8" rx="2"/><path d="M8.4 8.2l4.2 2.4-4.2 2.4z"/>
  {% elif icon == 'lock' %}
    <rect x="4.4" y="8.8" width="11.2" height="8" rx="1.8"/><path d="M7 8.8V6.6a3 3 0 0 1 6 0v2.2"/>
  {% else %}
    <path d="M4.6 3.4h10.8v13.2H4.6z"/><path d="M7.2 7h5.6M7.2 10h5.6M7.2 13h3.4"/>
  {% endif %}
</svg>
