{% comment %}
  Переключатель темы. Параметров нет.

  Показывается иконка той темы, на которую переключимся (в тёмной — солнце),
  выбор иконки делает CSS в app-shell.css по data-theme и prefers-color-scheme.
  Поэтому разметка одинакова в обеих темах и не требует контекста от view.
{% endcomment %}
<button class="app-nav__icon" id="theme-toggle" type="button" aria-label="Переключить тему">
  <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 3v2.2M12 18.8V21M21 12h-2.2M5.2 12H3M18.4 5.6l-1.55 1.55M7.15 16.85l-1.55 1.55M18.4 18.4l-1.55-1.55M7.15 7.15 5.6 5.6"/></svg>
  <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg>
</button>
